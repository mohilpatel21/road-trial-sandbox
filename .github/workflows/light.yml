name: light
# THE GREEN LIGHT (B2-ROAD-A · RELAY A · THE ROAD, 2026-09-30 — the decision map CD-5 · CD-8 · CD-9, the cross-check K-2 · K-11 · K-15;
# its prototype proven in THE TRIAL's P3, its false green on PR #3 cured here). When a `ci` or `law` run of a pull request completes,
# main's own copy of tool/road/light.py checks the pull request's current head — not a draft · the newest gate green · every law from
# main's law.yml green · GitHub's own merge state CLEAN — and then posts the green light once per head, mentioning the founder and
# re-assigning him so his phone rings. It runs none of the pull request's code. No workflow here triggers on a comment (CD-4).
on:
  workflow_run:
    workflows: [ci, law]
    types: [completed]
permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: write
  issues: write
concurrency:
  group: light-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  light:
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5      # main's own copy
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: python3 tool/road/light.py
