name: light
# The green light, posted from MAIN's own copy after the pr workflow succeeds on a ready pull request, once `law` is green too.
# READ FIRST is computed here from the PR's changed paths, so a PR cannot remove it by editing its own workflows.
on:
  workflow_run:
    workflows: [pr]
    types: [completed]
permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
jobs:
  light:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          OWNER: ${{ github.repository_owner }}
        run: |
          PR=$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$BRANCH" --jq '.[0].number // empty')
          [ -n "$PR" ] || { echo "no open pull request for $BRANCH"; exit 0; }
          [ "$(gh api "repos/$REPO/pulls/$PR" --jq .draft)" = false ] || { echo "draft — no light"; exit 0; }
          [ "$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)" = "$SHA" ] || { echo "stale run — the PR moved on"; exit 0; }
          law=""
          for i in $(seq 1 12); do
            law=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=law" --jq '[.check_runs[] | select(.app.slug=="github-actions")][0].conclusion // empty')
            [ -n "$law" ] && break
            sleep 10
          done
          echo "law on $SHA: ${law:-none}"
          [ "$law" = success ] || { echo "law is not green — no light"; exit 0; }
          short=$(printf '%s' "$SHA" | cut -c1-7)
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -q "light for $short"; then echo "already lit for $short"; exit 0; fi
          rf=""
          if gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -qE '^\.github/'; then
            rf="READ FIRST — this change touches the checks themselves. "
          fi
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="${rf}@mohilpatel21 ✅ all checks passed (light for $short) — you can tap Merge."
          gh api -X DELETE "repos/$REPO/issues/$PR/assignees" -f 'assignees[]=mohilpatel21' > /dev/null || true
          gh api -X POST "repos/$REPO/issues/$PR/assignees" -f 'assignees[]=mohilpatel21' > /dev/null
          echo "lit $PR at $short"
