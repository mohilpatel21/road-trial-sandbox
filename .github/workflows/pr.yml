name: pr
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.c.outputs.app }}
      walk: ${{ steps.c.outputs.walk }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD 2>/dev/null || git ls-files)
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qE '^(lib|test|specs)/'; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$files" | grep -qE '^(mocks|tool)/'; then echo "walk=true" >> "$GITHUB_OUTPUT"; else echo "walk=false" >> "$GITHUB_OUTPUT"; fi
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash test/check.sh
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/review_recorded.sh "origin/$BASE_REF"
  walk:
    needs: changes
    if: needs.changes.outputs.walk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm i --no-save puppeteer-core@25.4.0
      - run: CHROME=/usr/bin/google-chrome node tool/walk_dummy.js
  law:
    runs-on: ubuntu-latest
    steps:
      - run: echo "a fake law check posted by the PR's own workflow"
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "a hostile gate that passes whatever happened"
